name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verification:
    uses: ./.github/workflows/ci.yml

  android-native-release:
    name: Published Android native dependency
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: make rn-smoke-android-published

  ios-native-release:
    name: Published Swift native dependency
    needs: verification
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: make rn-smoke-ios-published

  publish:
    needs: [verification, android-native-release, ios-native-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Verify package
        run: make verify

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Verify npm registry visibility
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            if npm view "@debugbundle/sdk-react-native@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org | grep -Fx "${PACKAGE_VERSION}"; then
              exit 0
            fi
            echo "Package not visible on npm yet; retry ${attempt}/5."
            sleep 30
          done
          exit 1

      - name: Smoke published package
        run: npm run smoke:registry
