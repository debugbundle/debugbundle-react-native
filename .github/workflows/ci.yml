name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: TypeScript, tests, package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install --ignore-scripts --legacy-peer-deps
      - run: make verify

  android-static:
    name: Android bridge compile (RN ${{ matrix.rn-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rn-version: ["0.76.9", "0.82.1", "0.85.3"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - run: gradle --no-daemon -PreactNativeVersion=${{ matrix.rn-version }} :debugbundle-react-native:compileDebugJavaWithJavac

  android-clean-smoke:
    name: Android clean React Native app smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - uses: android-actions/setup-android@v3
      - run: npm install --ignore-scripts --legacy-peer-deps
      - run: make rn-smoke-android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

  ios-static:
    name: iOS bridge static check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: test -f DebugBundleReactNative.podspec
      - run: grep -R "import DebugBundle" ios
      - run: grep -R "DebugBundleHTTPTransport" ios

  ios-clean-smoke:
    name: iOS clean React Native app smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: debugbundle/debugbundle-swift
          path: debugbundle-swift
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install --ignore-scripts --legacy-peer-deps
      - run: make rn-smoke-ios
        env:
          SWIFT_SDK_ROOT: ${{ github.workspace }}/debugbundle-swift
