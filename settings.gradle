pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    def debugBundleAndroidRepository = providers.gradleProperty("debugBundleAndroidRepository").orNull
    if (debugBundleAndroidRepository != null && !debugBundleAndroidRepository.trim().isEmpty()) {
      maven {
        url = uri(debugBundleAndroidRepository)
      }
    }
    google()
    mavenCentral()
  }
}

rootProject.name = "debugbundle-react-native"
include ":debugbundle-react-native"
project(":debugbundle-react-native").projectDir = file("android")
